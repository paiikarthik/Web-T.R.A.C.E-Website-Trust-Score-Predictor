<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | PhiShield AI Security Terminal</title>
  <meta name="description" content="Sign in to the PhiShield AI Phishing Intelligence Terminal to access real-time URL detection and benchmark telemetry.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2306b6d4'><path d='M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V8.26l7-3.89v8.62z'/></svg>">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Left Hero Panel -->
      <div class="auth-hero-panel">
        <div class="auth-brand-top">
          <a href="index.html" class="back-home-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Project Overview
          </a>

          <div class="logo">
            <!-- <div class="logo-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <path d="M9 12l2 2 4-4"></path>
              </svg>
            </div> -->
            <span>Web T.R.A.C.E<span style="color:var(--accent-cyan);"></span></span>
          </div>
        </div>

        <div class="auth-hero-content">
          <h2></h2>
          <p>
           
          </p>

          <div class="auth-highlights">
            <div class="highlight-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              <!-- <span>Zero-Scraping 33-D Feature Extraction</span> -->
            </div>
            <div class="highlight-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
              <!-- <span>99.73% Peak Classification Accuracy</span> -->
            </div>
            <div class="highlight-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              <!-- <span>&lt;1.8ms Sub-Millisecond Inference</span> -->
            </div>
          </div>
        </div>

        <div class="auth-hero-footer">
          <!-- PhiUSIIL Academic Research Suite • Major Project Edition -->
        </div>
      </div>

      <!-- Right Form Card -->
      <div class="auth-form-card">
        <div class="auth-header">
          <h1>Login</h1>
          <p></p>
        </div>

        <!-- Inline Error Banner -->
        <div id="loginErrorAlert" class="toast toast-error" style="display:none; margin-bottom: 1.25rem;">
          Invalid email or password.
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <!-- Email / Username -->
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <div class="input-icon-wrap">
              <span class="input-left-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </span>
              <input 
                type="email" 
                id="loginEmail" 
                class="form-control" 
                placeholder="analyst@phishield.ai" 
                autocomplete="email"
                required
              >
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="loginPassword">
              <span>Password</span>
              <a href="#" id="forgotPasswordLink">Forgot Password?</a>
            </label>
            <div class="input-icon-wrap">
              <span class="input-left-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input 
                type="password" 
                id="loginPassword" 
                class="form-control" 
                placeholder="••••••••••••" 
                autocomplete="current-password"
                required
              >
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me Checkbox -->
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMeCheckbox" checked>
              <span>Keep session active on this workstation</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-lg" style="width:100%; margin-top:0.5rem;">
            Sign In
          </button>
        </form>


        <!-- Switch to Signup -->
        <div class="auth-switch">
          Don't have an  account? 
          <a href="signup.html">Create one here</a>
        </div>

      </div>

    </div>
  </div>

  <!-- JavaScript Files -->
  <script src="data.js"></script>
  <script src="main.js"></script>
  <script src="auth.js"></script>
</body>
</html>
