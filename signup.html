<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | PhiShield AI Research Terminal</title>
  <meta name="description" content="Create an account on the PhiShield AI research platform to analyze phishing threats and inspect machine learning explainability data.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2306b6d4'><path d='M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V8.26l7-3.89v8.62z'/></svg>">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Left Hero Panel -->
      <div class="auth-hero-panel">
        <div class="auth-brand-top">
          <a href="index.html" class="back-home-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Project Overview
          </a>

          <div class="logo">
            <span>Web T.R.A.C.E  <span style="color:var(--accent-cyan);"></span></span>
          </div>
        </div>

        <div class="auth-hero-content">
          <!-- <h2>Join the Next-Gen Phishing Detection Community</h2> -->
          <p>
            
          <div class="auth-highlights">
            <div class="highlight-item">
              <!-- <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> -->
              <!-- <span>Personalized Threat Inspection Dashboard</span> -->
            </div>
            <div class="highlight-item">
              <!-- <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> -->
              <!-- <span>Access to 235k Verified URL Telemetry</span> -->
            </div>
            <div class="highlight-item">
              <!-- <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> -->
              <!-- <span>Full Local Storage Session Persistence</span> -->
            </div>
          </div>
        </div>

        <div class="auth-hero-footer">
          <!-- Academic Research Suite • Pure Client-Side Architecture -->
        </div>
      </div>

      <!-- Right Form Card -->
      <div class="auth-form-card">
        <div class="auth-header">
          <h1>Create Account</h1>
          <!-- <p>Register to unlock full platform capabilities</p> -->
        </div>

        <!-- Inline Error Banner -->
        <div id="signupErrorAlert" class="toast toast-error" style="display:none; margin-bottom: 1.25rem;">
          Please check your inputs and try again.
        </div>

        <form id="signupForm" class="auth-form" novalidate>
          
          <!-- Full Name -->
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <div class="input-icon-wrap">
              <span class="input-left-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </span>
              <input 
                type="text" 
                id="signupName" 
                class="form-control" 
                placeholder="Dev" 
                required
              >
            </div>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <div class="input-icon-wrap">
              <span class="input-left-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </span>
              <input 
                type="email" 
                id="signupEmail" 
                class="form-control" 
                placeholder="dev@university.edu" 
                required
              >
            </div>
          </div>

          <!-- Role Selector -->
          <div class="form-group">
            <label for="signupRole">Specialization / Role</label>
            <div class="input-icon-wrap">
              <span class="input-left-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
              </span>
              <select id="signupRole" class="form-control" style="background: var(--bg-input);">
                <option value="Lead Security Analyst">Lead Security Analyst / SOC Engineer</option>
                <option value="ML Researcher">Machine Learning / Deep Learning Researcher</option>
                <option value="Academic Evaluator">Academic Evaluator / Faculty Member</option>
                <option value="Cybersecurity Student">Cybersecurity & CS Student</option>
                <option value="Threat Intelligence Specialist">Threat Intelligence Specialist</option>
                <option value="Threat Intelligence Specialist"> Common Man</option>
              </select>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <div class="input-icon-wrap">
              <span class="input-left-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input 
                type="password" 
                id="signupPassword" 
                class="form-control" 
                placeholder="Minimum 8 characters" 
                required
              >
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <!-- Password Strength Bar -->
            <div class="password-strength-wrap">
              <div id="passwordStrengthMeter" class="strength-meter">
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
              </div>
              <div class="strength-text">
                <span>Strength:</span>
                <span id="strengthLabel" class="level-label">Empty</span>
              </div>
            </div>

            <!-- Live Requirements Checklist -->
            <div class="pwd-requirements">
              <div id="reqLen" class="req-item"><span>•</span> 8+ characters</div>
              <div id="reqUpper" class="req-item"><span>•</span> Uppercase letter</div>
              <div id="reqLower" class="req-item"><span>•</span> Lowercase letter</div>
              <div id="reqNumber" class="req-item"><span>•</span> Number (0-9)</div>
              <div id="reqSpecial" class="req-item" style="grid-column: span 2;"><span>•</span> Special character (!@#$%^&*)</div>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="signupConfirmPassword">Confirm Password</label>
            <div class="input-icon-wrap">
              <span class="input-left-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
              </span>
              <input 
                type="password" 
                id="signupConfirmPassword" 
                class="form-control" 
                placeholder="Repeat password" 
                required
              >
            </div>
          </div>

          <!-- Terms Checkbox -->
          <div>
            <label class="checkbox-label">
              <input type="checkbox" id="signupTerms" checked required>
              <!-- <span>I acknowledge the Academic Research & Ethical AI Guidelines</span> -->
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="signupSubmitBtn" class="btn btn-primary btn-lg" style="width:100%; margin-top:0.5rem;">
            Create Account
          </button>
        </form>

        <!-- Switch to Login -->
        <div class="auth-switch">
          Already registered? 
          <a href="login.html">Login Now</a>
        </div>

      </div>

    </div>
  </div>

  <!-- JavaScript Files -->
  <script src="data.js"></script>
  <script src="main.js"></script>
  <script src="auth.js"></script>
</body>
</html>
